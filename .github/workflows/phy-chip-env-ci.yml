name: phy-chip-env CI

on:
  push:
    paths:
      - "phy-chip-env/**"
      - "athma-train/athma_train/env/**"
      - "athma-train/athma_train/harnesses/**"
      - ".github/workflows/phy-chip-env-ci.yml"
  pull_request:
    paths:
      - "phy-chip-env/**"
      - "athma-train/athma_train/env/**"
      - "athma-train/athma_train/harnesses/**"
      - ".github/workflows/phy-chip-env-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phy-chip-env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phy-chip-env/pyproject.toml

      - name: Build pinned ngspice-46
        working-directory: phy-chip-env
        run: bash scripts/install_ngspice46.sh

      - name: Install package and test tools
        working-directory: phy-chip-env
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        working-directory: phy-chip-env
        run: ruff check src tests scripts

      - name: Test scorer, sandbox, attacks, harnesses, and parity
        working-directory: phy-chip-env
        env:
          PHYCHIP_REQUIRE_NGSPICE: "46"
        run: pytest -q -p no:cacheprovider
