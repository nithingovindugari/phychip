[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[project]
name = "phy-chip-env"
version = "0.1.0"
description = "A sandboxed ngspice verifier and structured RLVR reward environment for analog circuit design"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nithin Reddy" }]
keywords = ["rlvr", "reinforcement-learning", "ngspice", "analog-circuits", "verifier"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
phy-chip-env = "phy_chip_env.cli:main"
phy-chip-score = "phy_chip_env.cli:score_main"

[project.urls]
Repository = "https://github.com/NithinReddyG/phy-chip"
Issues = "https://github.com/NithinReddyG/phy-chip/issues"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires a local ngspice-46 runtime",
  "parity: requires the parent PhyChip repository",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv]
required-version = ">=0.9.28,<0.10"
